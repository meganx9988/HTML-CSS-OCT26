<!-- 
  HTML5 Document Type Declaration.
  Tells the browser to use modern HTML5 standards for rendering.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- 
    Character encoding set to UTF-8.
    Ensures all text and symbols display correctly across devices.
  -->
  <meta charset="UTF-8" />

  <!-- 
    Page title shown in the browser tab.
    Descriptive titles help with SEO and user orientation.
  -->
  <title>Portfolio - Megan's Projects</title>

  <!-- 
    Viewport meta tag.
    Makes the website responsive on mobile, tablet, and desktop devices.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Internal CSS styles -->
  <style>
    /* 
      Body styles:
      - Light gray background
      - Clean Arial font
      - Removes default browser margin
    */
    body {
      background: linear-gradient(to right, #080808, #f10808);
      font-family: 'Franklin Gothic Medium', 'Arial Narrow';
      margin: 0;
    }

    /* 
      Header styling:
      - Blue background matching the theme
      - White text for high contrast
      - Centered content with generous padding
    */
    header {
      background-color: hwb(61 3% 5%);
      padding: 30px;
      text-align:center;
      color: #f10808;
    }

    /* 
      Main heading (h1):
      - Removes default margin
      - Large, bold font size for visual impact
    */
    h1 {
        color: gray;
      margin: 0;
      font-size: 80px;
    }

    /* 
      Main content container:
      - Max width of 1000px for comfortable reading
      - Centered on the page
      - White background with subtle shadow (card effect)
      - Rounded corners for modern appearance
    */
    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
      color: gold;
      background: rgb(245, 244, 243) (54, 93%, 35%);
      border-radius: 30px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    /* 
      Portfolio Grid using CSS Grid:
      - display: grid turns the container into a grid layout
      - repeat(auto-fit, minmax(250px, 1fr)) creates a responsive grid:
        * auto-fit = automatically adjusts number of columns
        * minmax(250px, 1fr) = each column is at least 250px wide, 
          but can grow to fill available space
      - gap: 20px adds consistent spacing between cards
    */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 30px;
    }

    /* 
      Individual project card styling:
      - Light blue background
      - Padding and rounded corners
      - Subtle shadow
      - transition enables smooth hover animation
    */
    .project {
      background: gold;
      padding: 30px;
      border-radius: 70px;
      box-shadow: 0px 4px 8px #ec04041a;
      transition: transform 0.2s;
    }

    /* 
      Hover effect on project cards:
      - translateY(-5px) makes the card lift up slightly when hovered
      - Creates an interactive, modern feel
    */
    .project:hover {
      transform: matrix(1, 0, 0, 1, 0, -10);
      transform: scale(1.5);
      transform: rotate(5deg);
    }

    /* 
      Project image styling:
      - width: 100% makes image fill the card width
      - height: 180px sets a consistent height
      - object-fit: cover prevents image distortion while filling the space
      - border-radius adds rounded corners
      - margin-bottom creates space before the button
    */
    .project img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 50px;
      margin-bottom: 10px;
    }

    /* 
      "View Project" button styling:
      - display: inline-block allows padding and margin
      - Blue background matching the theme
      - White text with bold weight
      - transition for smooth color change on hover
    */
    .project a {
      display: inline-block;
      background: black;
      color: gold;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }

    /* 
      Button hover effect:
      - Darker blue on hover for visual feedback
    */
    .project a:hover {
      background: #2563eb;
    }

    /* 
      Back to Home link:
      - display: block puts it on its own line
      - Centered and bold for visibility
      - Blue color matching the site theme
    */
    .back-link {
      display: block;
      margin-top: 30px;
      text-align: center;
      font-weight: bold;
      color: #181617;
      text-decoration: none;
    }

    /* 
      Footer styling:
      - Light gray background
      - Centered text
      - Padding for spacing
    */
    footer {
      background-color: #0e0e0f;
      text-align: right;
      padding: 10px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <!-- Page header with main title -->
  <header>
    <h1>Megan's Portfolio</h1>
  </header>

  <!-- Main content area -->
  <main>
    <h2>Featured Projects</h2>

    <!-- 
      Portfolio grid container.
      Uses CSS Grid (defined above) to create a responsive layout 
      that automatically adjusts the number of columns based on screen size.
    -->
    <div class="portfolio-grid">
      
      <!-- Project Card 1 -->
      <div class="project">
        <!-- 
          Project image using picsum.photos (placeholder service).
          Always include descriptive alt text for accessibility.
        -->
        <img src="https://picsum.photos/id/1018/600/300" alt="Project 1">
        
        <!-- 
          Link to view the project.
          target="_blank" opens the link in a new tab.
          In real projects, consider adding rel="noopener" for security.
        -->
        <a href="https://example.com/project1" target="_blank">View Project 1</a>
      </div>

      <!-- Project Card 2 -->
      <div class="project">
        <img src="https://picsum.photos/id/180/600/300" alt="Project 2">
        <a href="https://example.com/project2" target="_blank">View Project 2</a>
      </div>

      <!-- Project Card 3 -->
      <div class="project">
        <img src="https://picsum.photos/id/251/600/300" alt="Project 3">
        <a href="https://example.com/project3" target="_blank">View Project 3</a>
      </div>

      <!-- Project Card 4 -->
      <div class="project">
        <img src="https://picsum.photos/id/1015/600/300" alt="Project 4">
        <a href="https://example.com/project4" target="_blank">View Project 4</a>
      </div>

    </div>

    <!-- Back to Home navigation link -->
    <a href="#" class="back-link">&star; Back to Home</a>
  </main>

  <!-- Page footer with copyright -->
  <footer>
    <p>&copy; 2026 Era Academy</p>
  </footer>
</body>
</html>
